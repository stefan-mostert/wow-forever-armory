name: Mocked updater tests
on:
  pull_request:
  push:
    branches-ignore:
      - main
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
